server:
  name: Kervan File Server
  listen_address: 0.0.0.0
  data_dir: ./data
  log_level: info
  log_format: json
  log_file: ""
  log_max_size_mb: 100
  log_max_backups: 5
  graceful_shutdown_timeout: 30s

ftp:
  enabled: true
  port: 2121
  banner: Welcome to Kervan File Server
  passive_port_range: 50000-50100
  passive_ip: ""
  active_mode: true          # PORT/EPRT; data connections only go back to the client's own IP
  ascii_transfer: true       # no effect: TYPE A is accepted, data is always sent as-is
  max_connections: 500       # concurrent control connections, 0 = unlimited
  idle_timeout: 300s
  transfer_timeout: 1h
  virtual_hosts: {}          # RFC 7151 HOST / FTPS SNI; e.g. files.acme.example: {banner: ..., allowed_groups: [acme]}

ftps:
  enabled: false
  mode: explicit
  implicit_port: 990
  min_tls_version: "1.2"
  max_tls_version: "1.3"
  cert_file: ""
  key_file: ""
  client_auth: none          # none | request | require (needs client_ca_file)
  client_ca_file: ""

sftp:
  enabled: true
  port: 2222
  host_key_dir: ./data/host_keys
  host_key_algorithms:       # no effect: a single ed25519 host key is used
    - ed25519
    - rsa
  max_connections: 500       # concurrent SSH connections, 0 = unlimited
  idle_timeout: 300s
  disable_shell: true        # no effect: shells are never offered

scp:
  enabled: true

webui:
  enabled: true
  port: 8080
  tls: false
  bind_address: 0.0.0.0
  read_timeout: 15s
  read_header_timeout: 10s
  write_timeout: 60s
  idle_timeout: 120s
  admin_username: admin
  admin_password: ""
  session_timeout: 24h
  totp_enabled: false
  cors_origins: []
  oidc:                      # WebUI single sign-on; see README "Single sign-on"
    enabled: false
    issuer: ""               # e.g. https://login.example.com/realms/acme
    client_id: ""
    client_secret: ""
    redirect_url: ""         # https://<host>/api/v1/auth/oidc/callback
    scopes: [openid, profile, email]
    button_label: Sign in with SSO
    username_claim: preferred_username,email
    groups_claim: groups
    allowed_groups: []
    admin_groups: []
    group_mapping: {}
    auto_create: true
    home_dir: /{username}

debug:
  enabled: false
  bind_address: 127.0.0.1
  port: 6060
  pprof: true

auth:
  default_provider: local    # no effect: local users first, then LDAP when enabled
  password_hash: argon2id
  min_password_length: 8
  require_special_char: false
  ldap:
    enabled: false
    url: ""
    bind_dn: ""
    bind_password: ""
    base_dn: ""

storage:
  default_backend: local
  backends:
    local:
      type: local
      options:
        root: ./data/files

quota:
  enabled: true
  default_max_storage: 1073741824
  default_max_files: 100000  # no effect: only default_max_storage is enforced
  check_interval: 60s        # no effect: usage is tracked on every write

audit:
  enabled: true
  integrity:                 # HMAC-chained, tamper-evident file outputs; check with "kervan audit verify"
    enabled: true
    key_file: ""             # default <data_dir>/audit.key (back it up with the log)
  outputs:
    - type: file
      path: ./data/audit.jsonl
      max_size_mb: 100       # rotate at this size; -1 never rotates
      max_backups: 10        # rotated files kept; -1 keeps all
    # - type: webhook
    #   url: https://audit.example.com/events
    #   method: POST
    #   headers:
    #     Authorization: Bearer change-me
    #   batch_size: 50
    #   flush_interval: 5s
    #   retry_count: 3
    # - type: syslog
    #   url: tls://siem.example.com:6514   # udp://, tcp://, tls://, unix:///dev/log
    #   format: rfc5424                    # or cef
    #   facility: local0

security:
  # IPs or CIDRs, applied to FTP, SFTP/SCP and the WebUI/API; deny wins.
  # An empty allowed_ips admits everyone. Reloadable at runtime.
  allowed_ips: []
  denied_ips: []
  brute_force:
    enabled: true
    max_attempts: 5          # per-account failures before lockout
    lockout_duration: 15m
    ip_ban_threshold: 20     # per-address failures (all protocols) before a ban
    ip_ban_duration: 1h
    whitelist_ips: []        # never banned

mcp:
  enabled: true
  transport: stdio           # only stdio is supported
