name: CI

# Runs on every pull_request, so a PR cannot merge without its checks.
# Deliberately `pull_request` and not `pull_request_target`: the former gives
# the run a read-only token and no repository secrets, which is what untrusted
# fork code needs. `workflow_dispatch` remains for manual runs and for the
# docker input, which pull_request does not provide.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: Also build the production Docker image
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run gofmt check
        run: |
          # git ls-files, not find: it matches tracked sources only, so local
          # scratch dirs (.temp_files/) and vendored trees cannot fail the build.
          files="$(git ls-files '*.go' | grep -v '^webui/')"
          test -n "$files"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Build binary
        run: go build ./cmd/kervan

  race:
    name: Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests with -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  windows:
    name: Windows Store Tests
    runs-on: windows-latest

    # internal/store has two build-tagged platform implementations that no
    # Linux job can exercise: replaceFile and lockFile in atomic_windows.go
    # (MoveFileEx + LockFileEx). They are compile-verified by the backend job
    # only. GOOS=windows cannot help here — it cross-compiles, it does not run
    # the tests — so this job needs a real Windows runner.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run store tests (JSON backend)
        run: go test ./internal/store/ -count=1 -v

      - name: Run store tests (SQLite backend)
        env:
          KERVAN_STORE_BACKEND: sqlite
        run: go test ./internal/store/ -count=1

      - name: Build binary for Windows
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/kervan

  race-sqlite:
    name: Race Detector (SQLite backend)
    runs-on: ubuntu-latest

    # The backend and race jobs above only exercise the default JSON backend.
    # The SQLite engine exists to improve concurrency, so its transactions and
    # locking need the detector too. Mirrors `make check-sqlite`.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests with -race against the SQLite backend
        env:
          CGO_ENABLED: "1"
          KERVAN_STORE_BACKEND: sqlite
        run: go test -race ./... -count=1

  webui:
    name: WebUI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Run WebUI tests
        working-directory: webui
        run: npm test

      - name: Build WebUI and refresh embedded assets
        run: go run ./scripts

      - name: Verify committed embedded assets are up to date
        run: git diff --exit-code -- internal/webui/dist

  docker:
    name: Docker Image Build
    # Never on pull_request: the `inputs` context is empty there, and image
    # builds are release work, not a pull-request gate.
    if: ${{ github.event_name != 'pull_request' && inputs.docker }}
    runs-on: ubuntu-latest
    needs:
      - backend
      - webui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t kervan:ci .
